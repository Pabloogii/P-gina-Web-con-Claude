<svg width="420" height="180" viewBox="0 0 420 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Isotipo PG</title>
  <desc id="desc">Monograma dorado PG sobre fondo transparente para usar en la cabecera.</desc>
  <defs>
    <linearGradient id="goldMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe9a0" />
      <stop offset="45%" stop-color="#f4c45c" />
      <stop offset="100%" stop-color="#d6921e" />
    </linearGradient>
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>
  <g filter="url(#markShadow)">
    <text x="18" y="126" fill="url(#goldMark)" font-family="'Poppins','Segoe UI','Helvetica Neue',sans-serif" font-size="148" font-weight="800" letter-spacing="10">PG</text>
  </g>
</svg>
